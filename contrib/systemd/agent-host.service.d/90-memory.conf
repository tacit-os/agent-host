[Service]
# The only member of the set with no bound, and the one that has peaked at 9.9 GB on a 15 GB
# machine whose documented failure mode is a memory-exhaustion freeze. The sessions it runs are
# capped in their own scopes (systemd-run, MemoryHigh=3G/MemoryMax=5G/MemorySwapMax=2G) and are not counted here.
# High throttles and reclaims; Max kills, which OnFailure= then says out loud. Max counts memory only: with no
# swap cap the host went on past High into swap without a bound, the freeze the sessions' cap is there to stop.
MemoryHigh=3G
MemoryMax=8G
MemorySwapMax=2G
# service.d/50-oomd-avoid.conf shields every user service, this one included. Named here so
# systemd-oomd can pick it: it is a background daemon, not the session.
ManagedOOMPreference=none
