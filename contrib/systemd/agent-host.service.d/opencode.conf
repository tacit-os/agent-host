# Shipped by the tacit-agent-host package beside agent-host.service.
# `opencode serve` runs in a systemd scope of its own, so KillMode never reaches it. The host stops
# them on SIGTERM and sweeps orphans at start; this covers a host that died hard (SIGKILL, MemoryMax).
# $MAINPID is empty in ExecStopPost after a kill, so this stops every agent-opencode scope whose
# host pid no longer exists. Tested on a transient unit with SIGKILL.
[Service]
ExecStopPost=-/bin/sh -c 'for u in $$(systemctl --user list-units --plain --no-legend --all "agent-opencode-*.scope" | cut -d" " -f1); do p=$${u#agent-opencode-}; p=$${p%%%%-*}; [ -d /proc/$$p ] || systemctl --user stop $$u; done'
